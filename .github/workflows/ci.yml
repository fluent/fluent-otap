name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Linux / ${{ matrix.cc }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: gcc
            cxx: g++
            go_interop: 'ON'
          - cc: clang
            cxx: clang++
            go_interop: 'OFF'
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        if: matrix.go_interop == 'ON'
        with:
          go-version-file: tests/interop/go.mod
          cache-dependency-path: tests/interop/go.sum
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y liblz4-dev libzstd-dev valgrind
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DFLUENT_OTAP_GO_INTEROP=${{ matrix.go_interop }}
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Check memory
        if: matrix.cc == 'gcc'
        run: >
          valgrind --leak-check=full --show-leak-kinds=all
          --errors-for-leak-kinds=all --error-exitcode=99
          build/tests/fluent-otap-test tests/fixtures
